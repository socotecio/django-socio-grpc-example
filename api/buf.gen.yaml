# buf generator file
# buf lint grpc
# buf generate grpc

version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: django-socio-grpc-example
plugins:
  - remote: buf.build/protocolbuffers/go
    out: grpc/go
    opt: paths=source_relative
  - remote: buf.build/bufbuild/connect-go
    out: grpc/go
    opt: paths=source_relative
  - remote: buf.build/grpc/python:v1.74.0
    out: grpc/python
  - remote: buf.build/protocolbuffers/python:v31.1
    out: grpc/python
  # dependencies
  - remote: buf.build/protocolbuffers/pyi:v31.1
    out: grpc/python
  - remote: buf.build/bufbuild/es:v2.6.0
    out: grpc/gen
  - remote: buf.build/grpc/web:v1.5.0
    out: grpc/grpc-web
    opt: mode=grpcwebtext
  # dependencies
  - remote: buf.build/protocolbuffers/js:v3.21.4
    out: grpc/grpc-web